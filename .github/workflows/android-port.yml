name: Android ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    name: Controls and runtime without game data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install pytest
      - name: Production C/Java fixtures
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          python -m pytest -q
          tests/unit/test_android_cs_cache.py
          tests/unit/test_android_index_packets.py
          tests/unit/test_android_launch_snapshot.py
          tests/unit/test_android_wrench_touch.py
          tests/unit/test_android_audio_policy.py
          tests/unit/test_android_thread_policy.py
          tests/unit/test_android_v7_native.py
          tests/unit/test_android_vertex_parallel.py
          tests/unit/test_android_ci_sources.py
